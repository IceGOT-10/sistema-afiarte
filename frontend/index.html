<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiarte - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="p-6 text-center border-b border-slate-700">
            <h1 class="text-2xl font-bold tracking-wider text-blue-400"><i class="fas fa-cut mr-2"></i>AFIARTE</h1>
            <p class="text-xs text-slate-400 mt-1">Gestão de Oficina</p>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="mudarAba('pdv')" class="w-full flex items-center p-3 bg-blue-600 rounded-lg text-white transition-colors border-none text-left">
                <i class="fas fa-cash-register w-6"></i> Caixa / PDV
            </button>
            <button onclick="mudarAba('financeiro')" class="w-full flex items-center p-3 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors border-none text-left">
                <i class="fas fa-chart-line w-6"></i> Financeiro
            </button>
            <button onclick="mudarAba('produtos')" class="w-full flex items-center p-3 hover:bg-slate-800 rounded-lg text-slate-300 transition-colors border-none text-left">
                <i class="fas fa-box w-6"></i> Serviços
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full relative">
        
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <h2 id="titulo-aba" class="text-xl font-semibold text-gray-800">Ponto de Venda</h2>
            <div class="flex items-center text-sm text-gray-500">
                <i class="fas fa-circle text-green-500 mr-2 text-xs"></i> API Conectada
            </div>
        </header>

        <div class="p-6 flex-1 overflow-auto bg-gray-50" id="conteudo-principal">
            
            <div id="tela-pdv" class="flex gap-6 h-full">
                
                <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col">
                    <h3 class="font-semibold text-gray-700 mb-4 border-b pb-2">Catálogo de Serviços</h3>
                    <div id="grid-produtos" class="grid grid-cols-2 lg:grid-cols-3 gap-3 overflow-y-auto pr-2 pb-2">
                        <div class="text-center text-gray-400 py-10 col-span-full">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>Carregando serviços...
                        </div>
                    </div>
                </div>

                <div class="w-96 bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col">
                    <h3 class="font-semibold text-gray-700 mb-4 border-b pb-2">Venda Atual</h3>
                    
                    <div id="lista-carrinho" class="flex-1 overflow-y-auto space-y-3 mb-4">
                        <div class="text-center text-gray-400 text-sm mt-10">
                            Nenhum item adicionado.<br>Clique nos serviços ao lado.
                        </div>
                    </div>

                    <div class="border-t pt-4">
                        <div class="flex justify-between text-lg font-bold text-gray-800 mb-4">
                            <span>Total:</span>
                            <span id="valor-total-carrinho">R$ 0,00</span>
                        </div>
                        
                        <div class="space-y-2">
                            <select id="forma-pagamento" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 text-sm">
                                <option value="Pix">Pix</option>
                                <option value="Dinheiro">Dinheiro</option>
                                <option value="Cartão">Cartão</option>
                            </select>
                            <button onclick="finalizarVenda()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded transition-colors flex justify-center items-center gap-2">
                                <i class="fas fa-check-circle"></i> Finalizar Venda
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tela-financeiro" class="hidden">
                <h3 class="text-gray-600">Módulo Financeiro e Gráficos virão aqui...</h3>
            </div>

            <div id="tela-produtos" class="hidden">
                <h3 class="text-gray-600">Gestão de Serviços virá aqui...</h3>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
